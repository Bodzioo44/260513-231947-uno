; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = uno
framework = arduino
extra_scripts = pre:extra_script.py

[env:transmitter]
build_src_filter = +<Transmitter/Transmitter.cpp> +<Transmitter/Adafruit_Nokia5110.cpp>
lib_deps = 
	adafruit/Adafruit PCD8544 Nokia 5110 LCD library@^2.0.3
	nrf24/RF24@^1.6.0
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit BMP085 Library@^1.2.4
	mprograms/QMC5883LCompass@^1.2.3
	arduino-libraries/Servo@^1.3.0
	
[env:receiver]
build_src_filter = +<Receiver/>
lib_deps = 
	nrf24/RF24@^1.6.0
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit BMP085 Library@^1.2.4
	mprograms/QMC5883LCompass@^1.2.3
	arduino-libraries/Servo@^1.3.0
