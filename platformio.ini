; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	nrf24/RF24@^1.6.0
	adafruit/Adafruit PCD8544 Nokia 5110 LCD library@^2.0.3
	adafruit/Adafruit MPU6050@^2.2.9
	adafruit/Adafruit BMP085 Library@^1.2.4
	mprograms/QMC5883LCompass@^1.2.3

[env:transmitter]
upload_port = COM4
monitor_port = COM4
build_src_filter = +<Transmitter/>
; build_src_filter = +<Transmitter.cpp> +<MPU6050.cpp> -<Receiver.cpp>


[env:receiver]
upload_port = COM5
monitor_port = COM5
build_src_filter = +<Receiver/>
; build_src_filter = +<Receiver.cpp> +<MPU6050.cpp> -<Transmitter.cpp>
